    <use href="#snow" transform="translate(208 112) rotate(22) scale(.8)"/>
    <use href="#snow" transform="translate(41 164) rotate(-10) scale(.7)"/>
    <use href="#snow" transform="translate(159 209) rotate(18) scale(.65)"/>
  </g>
  <g fill="#a7cce4">
    <circle cx="133" cy="23" r="1.5"/><circle cx="204" cy="65" r="1.8"/>
    <circle cx="28" cy="104" r="1.5"/><circle cx="188" cy="182" r="1.4"/>
    <circle cx="67" cy="201" r="1.7"/><circle cx="111" cy="216" r="1"/>
  </g>
  <g fill="#c2b0e3" opacity=".75">
    <circle cx="39" cy="126" r="1"/><circle cx="192" cy="146" r="1"/>
    <circle cx="88" cy="218" r="1.2"/><circle cx="54" cy="184" r=".9"/>
  </g>
</svg>
